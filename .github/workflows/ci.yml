name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: forensic
          # Trust auth: no password, so nothing credential-shaped is committed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Non-secret e2e boot config. NOTE: NODE_ENV is intentionally NOT set to
      # production here - that would make `npm ci` skip devDependencies (vitest,
      # playwright). The `npm run start` script sets NODE_ENV=production itself
      # for the server process. LOCAL_DEV=true is the documented e2e setup (see
      # tests/e2e/api.spec.js): requests from 127.0.0.1 count as the owner, so the
      # full owner CRUD path is exercised without a Google session. The Bearer
      # gate and input validation are exercised separately in the same spec.
      LOCAL_DEV: "true"
      DATABASE_URL: postgres://localhost:5432/forensic
      PGUSER: postgres
      DATABASE_SSL: "false"
      OWNER_USER_ID: 00000000-0000-0000-0000-000000000001
      # Non-secret auth config so /api/health reports ok:true (the webServer
      # readiness probe). Google OAuth is never actually called in e2e - the
      # specs exercise unauthenticated/Bearer paths only.
      GOOGLE_CLIENT_ID: e2e-dummy-client-id
      OWNER_EMAIL: owner@example.com

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm audit # zero vulnerabilities, same bar as CONTRIBUTING

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Throwaway secrets, generated fresh each run - never real credentials.
      - name: Generate throwaway e2e secrets
        run: |
          {
            echo "FORENSIC_API_SECRET=e2e-$(openssl rand -hex 16)"
            echo "AUTH_SECRET=e2e-$(openssl rand -hex 16)"
            echo "GOOGLE_CLIENT_SECRET=e2e-$(openssl rand -hex 8)"
          } >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Apply database migrations
        run: npm run migrate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (API + browser render, against a production build)
        run: npm run test:e2e

      - name: Upload E2E traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
